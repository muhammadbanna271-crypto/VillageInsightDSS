{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

VillageInsight DSS

</title>

<link rel="icon"
href="{% static 'favicon.ico' %}">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{% static 'css/login.css' %}">

</head>

<body>

<div class="background"></div>

<div class="login-card">

<div class="logo">

<img
src="{% static 'img/logo.svg' %}"
alt="VillageInsight DSS">

<h1>

VillageInsight DSS

</h1>

<p>

Decision Support System

for Smart Tourism Village

</p>

</div>

<form method="post">

{% csrf_token %}

<div class="field">

<label>

Username

</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
name="username"
placeholder="Masukkan username"
required>

</div>

</div>

<div class="field">

<label>

Password

</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
id="password"
type="password"
name="password"
placeholder="Masukkan password"
required>

<button
type="button"
id="showPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

{% if form.errors %}

<div class="error">

Username atau password salah.

</div>

{% endif %}

<button class="login-btn">

<i class="fa-solid fa-arrow-right-to-bracket"></i>

Masuk ke Dashboard

</button>

</form>

<footer>

Department of Statistics

<br>

Universitas Brawijaya

<span>

© 2026 VillageInsight DSS

</span>

</footer>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
